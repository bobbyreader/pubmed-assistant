<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PubMed 文献研究助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="header-title">🔬 PubMed 文献研究助手</h1>
            <p class="header-subtitle">输入关键词，快速搜索医学文献</p>
        </header>

        <!-- Tip Banner -->
        <div class="tip-banner">
            💡 支持中文或英文关键词搜索，输入中文会自动翻译。<br>
            点击 ⭐ 收藏感兴趣的文献，收藏数据保存在本地浏览器中。
        </div>

        <!-- Tab Navigation -->
        <nav class="tab-nav" role="tablist">
            <button class="tab-btn active" data-tab="search" role="tab" aria-selected="true">
                🔍 搜索文献
            </button>
            <button class="tab-btn" data-tab="favorites" role="tab" aria-selected="false">
                ⭐ 我的收藏
            </button>
        </nav>

        <!-- Search Panel -->
        <div id="search-panel" class="panel active" role="tabpanel" aria-labelledby="tab-search">
            <!-- Filter Toggle -->
            <div class="filter-toggle">
                <button id="filter-toggle-btn" class="filter-toggle-btn" type="button">
                    🔧 显示筛选条件
                </button>
            </div>

            <!-- Filter Panel -->
            <div id="filter-panel" class="filter-panel">
                <div class="filter-panel-title">🎯 高级筛选</div>
                <div class="filter-grid">
                    <div class="filter-group">
                        <label for="filter-year-from">起始年份</label>
                        <input type="number" id="filter-year-from" placeholder="例如：2020" min="1900" max="2026">
                    </div>
                    <div class="filter-group">
                        <label for="filter-year-to">结束年份</label>
                        <input type="number" id="filter-year-to" placeholder="例如：2024" min="1900" max="2026">
                    </div>
                    <div class="filter-group">
                        <label for="filter-author">作者姓名</label>
                        <input type="text" id="filter-author" placeholder="例如：Smith">
                    </div>
                    <div class="filter-group">
                        <label for="filter-journal">期刊名称</label>
                        <input type="text" id="filter-journal" placeholder="例如：Nature">
                    </div>
                </div>
                <div class="filter-grid">
                    <div class="filter-group" style="grid-column: 1 / -1;">
                        <label for="filter-limit">每页显示数量</label>
                        <select id="filter-limit">
                            <option value="10" selected>10 篇</option>
                            <option value="20">20 篇</option>
                            <option value="50">50 篇</option>
                            <option value="100">100 篇</option>
                        </select>
                    </div>
                </div>
                <div class="filter-actions">
                    <button id="filter-apply-btn" class="filter-btn filter-btn-apply" type="button">应用筛选</button>
                    <button id="filter-clear-btn" class="filter-btn filter-btn-clear" type="button">清空筛选</button>
                </div>
            </div>

            <!-- Search Card -->
            <div class="search-card">
                <div class="search-row">
                    <div class="search-input-wrapper">
                        <span class="search-icon">🔍</span>
                        <input
                            type="text"
                            id="search-input"
                            class="search-input"
                            placeholder="输入中文或英文关键词，例如：糖尿病、COVID-19、癌症治疗..."
                            autocomplete="off"
                        >
                    </div>
                    <button id="search-btn" class="search-btn" type="button">
                        搜索
                    </button>
                </div>
                <div id="translation-info"></div>
            </div>

            <!-- Loading -->
            <div id="loading" style="display: none; text-align: center; color: var(--color-text-muted); padding: 16px; font-size: var(--font-size-sm);">
                正在搜索中，请稍候...
            </div>

            <!-- Error -->
            <div id="error-container"></div>

            <!-- Results Info -->
            <div id="results-info"></div>

            <!-- Results List -->
            <div id="results-list" class="results-list"></div>

            <!-- Pagination -->
            <div id="pagination" class="pagination"></div>
        </div>

        <!-- Favorites Panel -->
        <div id="favorites-panel" class="panel" role="tabpanel" aria-labelledby="tab-favorites">
            <div class="favorites-header">
                <div class="favorites-count">
                    📚 收藏数量：<span id="fav-count" class="count-num">0</span>
                </div>
                <button id="export-btn" class="btn-export" type="button">
                    📥 导出收藏
                </button>
            </div>
            <div id="favorites-list" class="results-list"></div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
